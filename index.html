<style>
  :root{
    --papyrus:#EDE3C8; --papyrus-card:#F8F2DE; --ink:#2A2118; --ink-soft:#5B4E3B;
    --nile:#1F5C63; --nile-dark:#123B40; --nile-light:#DCEAE9;
    --gold:#B8892F; --gold-light:#F1E1B8; --clay:#A6542A; --line:#D9CBA3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--papyrus);color:var(--ink);font-family:'Lora',serif;line-height:1.55;}
  h1,h2,h3,.disp{font-family:'Cinzel',serif;letter-spacing:.02em;font-weight:600;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  header{position:relative;padding-bottom:22px;border-bottom:2px solid var(--nile);margin-bottom:24px;}
  header .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--nile);display:flex;justify-content:space-between;align-items:center;}
  header h1{font-size:30px;margin:6px 0 4px;color:var(--nile-dark);}
  header p.sub{margin:0;color:var(--ink-soft);font-size:15px;}
  .people-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--papyrus-card);cursor:pointer;font-size:14px;color:var(--ink-soft);transition:border-color .15s, background .15s, color .15s;}
  .chip .dot{width:24px;height:24px;border-radius:50%;background:var(--nile-light);color:var(--nile-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;}
  .chip.active{border-color:var(--nile);background:var(--nile);color:#fff;}
  .chip.active .dot{background:var(--gold);color:var(--nile-dark);}
  .whoami-note{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
  .sync-btn{background:none;border:1px solid var(--nile);color:var(--nile);border-radius:6px;padding:4px 10px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;}
  .sync-btn:hover{background:var(--nile-light);}
  #syncStatus{font-size:11px;color:var(--ink-soft);}

  nav.tabs{display:flex;gap:2px;margin-bottom:26px;border-bottom:1px solid var(--line);}
  nav.tabs button{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.04em;background:none;border:none;padding:10px 18px;cursor:pointer;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px;}
  nav.tabs button.active{color:var(--nile-dark);border-bottom-color:var(--gold);}
  section{display:none;} section.active{display:block;}

  .flight-card{display:flex;justify-content:space-between;align-items:center;background:var(--nile-dark);color:var(--gold-light);border-radius:10px;padding:14px 18px;margin-bottom:10px;font-size:14px;}
  .flight-card .route{font-family:'Cinzel',serif;font-size:16px;color:#fff;}
  .flight-card .meta{text-align:right;color:var(--gold-light);opacity:.85;font-size:12.5px;}

  .river-wrap{position:relative;margin-top:18px;}
  .river-svg{display:block;width:100%;height:46px;}
  .day-list{display:flex;flex-direction:column;gap:10px;}
  .day-card{background:var(--papyrus-card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;gap:14px;align-items:flex-start;}
  .day-card .d{font-family:'JetBrains Mono',monospace;min-width:52px;text-align:center;color:var(--nile-dark);}
  .day-card .d .num{font-size:20px;font-weight:500;display:block;}
  .day-card .d .wd{font-size:11px;text-transform:uppercase;color:var(--ink-soft);}
  .day-card .body{flex:1;}
  .day-card .flag{font-size:12px;color:var(--clay);font-weight:600;margin-bottom:2px;}
  .day-card textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;font-family:'Lora',serif;font-size:14px;padding:8px 10px;resize:vertical;min-height:38px;color:var(--ink);}
  .day-card textarea:focus{outline:1.5px solid var(--nile);}

  .poll{background:var(--papyrus-card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
  .poll h3{margin:0 0 4px;font-size:17px;color:var(--nile-dark);}
  .poll .desc{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px;}
  .opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
  .opt{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;transition:border-color .15s, background .15s;}
  .opt:hover{border-color:var(--gold);}
  .opt.picked{border-color:var(--nile);background:var(--nile-light);}
  .opt .photo{width:100%;height:110px;background:var(--nile-light) center/cover no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
  .opt .photo.empty{background:var(--nile-light);}
  .opt .photo svg{opacity:.55;}
  .opt .photo .addphoto{position:absolute;bottom:4px;right:6px;font-size:10px;background:rgba(255,255,255,.85);color:var(--nile-dark);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;}
  .opt .clickzone{padding:12px 14px;cursor:pointer;}
  .opt .name{font-weight:600;font-size:14.5px;color:var(--ink);}
  .opt .odesc{font-size:12.5px;color:var(--ink-soft);margin:6px 0 8px;}
  .votes-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .vote-badge{width:22px;height:22px;border-radius:50%;background:var(--nile);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:500;}
  .vote-count{font-size:12px;color:var(--ink-soft);margin-left:2px;}

  table.budget{width:100%;border-collapse:collapse;font-size:14px;}
  table.budget th{text-align:left;font-family:'Cinzel',serif;font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);border-bottom:2px solid var(--nile);padding:8px 6px;}
  table.budget td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.budget input[type=number]{width:90px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:'JetBrains Mono',monospace;font-size:13.5px;background:#fff;color:var(--ink);}
  table.budget input[type=number]:focus{outline:1.5px solid var(--nile);}
  .badge-pp{font-size:10.5px;color:var(--ink-soft);}
  .budget-summary{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap;}
  .metric{background:var(--nile-dark);color:#fff;border-radius:10px;padding:14px 18px;min-width:150px;}
  .metric .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-light);opacity:.85;}
  .metric .value{font-family:'JetBrains Mono',monospace;font-size:22px;margin-top:4px;}
  .sunk-note{font-size:12.5px;color:var(--ink-soft);margin-top:14px;}

  .setup-banner{background:var(--clay);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:20px;line-height:1.5;}
  .setup-banner code{background:rgba(0,0,0,.2);padding:1px 5px;border-radius:4px;}
  .footer-note{margin-top:40px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;}
  .loading{padding:40px;text-align:center;color:var(--ink-soft);font-size:14px;}
</style>

let state = { me:null, interest:{}, calendar:{}, budget:{}, photos:{}, checklist:[] };
let wikiCache = {};
let syncStatus = STORAGE_READY ? "" : "⚠ falta configurar guardado compartido";

async function loadShared(){
  try{
    const res = await fetch('/api/state');
    const rec = await res.json();
    state.interest = rec.interest || rec.votes || {};
    state.calendar = rec.calendar || {};
    state.budget = rec.budget || {};
    state.photos = rec.photos || {};
    state.checklist = (rec.checklist && rec.checklist.length) ? rec.checklist : DEFAULT_CHECKLIST.map(x=>Object.assign({},x));
    syncStatus = "sincronizado";
  }catch(e){ syncStatus = "no se pudo sincronizar (¿está deployado en Vercel con KV conectado?)"; }
}
async function saveShared(){
  try{
    const res = await fetch('/api/state', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({interest:state.interest, calendar:state.calendar, budget:state.budget, photos:state.photos, checklist:state.checklist})
    });
    if(!res.ok) throw new Error('status '+res.status);
    syncStatus = "guardado ✓";
    lastSaveFailed = false;
  }catch(e){
    syncStatus = "⚠ no se guardó - revisá que estés en la URL de Vercel (no el archivo local) y que el KV esté conectado";
    lastSaveFailed = true;
  }
  updateSyncLabel();
}
let lastSaveFailed = false;
function updateSyncLabel(){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = syncStatus;
  el.style.color = lastSaveFailed ? '#c0392b' : '';
  el.style.fontWeight = lastSaveFailed ? '600' : '';
}

function loadMe(){ try{ state.me = localStorage.getItem('nile-me') || null; }catch(e){ state.me = null; } }
function saveMe(){ try{ localStorage.setItem('nile-me', state.me || ''); }catch(e){} }

function initials(name){ return name.slice(0,2).toUpperCase(); }
function fmtDay(dstr){
  const d = new Date(dstr+"T12:00:00");
  return { num: d.getDate(), wd: d.toLocaleDateString('es-AR',{weekday:'short'}).replace('.',''), mo: d.toLocaleDateString('es-AR',{month:'short'}).replace('.','') };
}
function riverSvg(){
  return '<svg class="river-svg" viewBox="0 0 900 46" preserveAspectRatio="none"><path d="M0 23 C 150 5, 300 41, 450 23 S 750 5, 900 23" fill="none" stroke="var(--nile)" stroke-width="3" opacity="0.35"/></svg>';
}

async function fetchWikiThumb(title){
  if(!title) return null;
  if(title in wikiCache) return wikiCache[title];
  try{
    const res = await fetch('https://es.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));
    const j = await res.json();
    wikiCache[title] = (j.thumbnail && j.thumbnail.source) ? j.thumbnail.source : null;
  }catch(e){ wikiCache[title] = null; }
  return wikiCache[title];
}
async function prefetchAllThumbs(){
  const titles = [];
  PLACES.forEach(seg=> seg.items.forEach(it=>{ if(it.wiki) titles.push(it.wiki); }));
  await Promise.all(titles.map(fetchWikiThumb));
}

async function init(){
  loadMe();
  BUDGET_CATEGORIES.forEach(c=>{ state.budget[c.id] = c.def; });
  await loadShared();
  BUDGET_CATEGORIES.forEach(c=>{ if(state.budget[c.id]===undefined) state.budget[c.id] = c.def; });
  if(!state.checklist || !state.checklist.length) state.checklist = DEFAULT_CHECKLIST.map(x=>Object.assign({},x));
  render();
  await prefetchAllThumbs();
  renderVotaciones();
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <div class="eyebrow"><span>Grupo · 6 viajeros</span><span style="display:flex;gap:8px;align-items:center;"><span id="syncStatus">${syncStatus}</span><button class="sync-btn" id="syncBtn">Sincronizar</button></span></div>
      <h1>Egipto, octubre 2026</h1>
      <p class="sub">Stuttgart → El Cairo → Asuán → crucero → Luxor → Hurghada → Stuttgart</p>
      <div class="people-row" id="peopleRow"></div>
      <div class="whoami-note">${state.me ? 'Estás votando como <b>'+state.me+'</b>.' : 'Elegí quién sos para poder votar y anotar cosas.'}</div>
    </header>
    <nav class="tabs" id="tabs">
      <button data-tab="itinerario" class="active">Itinerario</button>
      <button data-tab="mapa">Mapa</button>
      <button data-tab="votaciones">Lugares</button>
      <button data-tab="checklist">Para reservar</button>
      <button data-tab="presupuesto">Presupuesto</button>
    </nav>
    <section id="tab-itinerario" class="active"></section>
    <section id="tab-mapa"></section>
    <section id="tab-votaciones"></section>
    <section id="tab-checklist"></section>
    <section id="tab-presupuesto"></section>
    <div class="footer-note">Todo lo que se vota, anota, edita o el link de foto que pegan acá lo ven los 6 (si el guardado compartido está configurado). Los montos del presupuesto son estimaciones de referencia.</div>
  `;

  document.getElementById('syncBtn').addEventListener('click', async ()=>{ syncStatus='sincronizando…'; updateSyncLabel(); await loadShared(); render(); });

  const peopleRow = document.getElementById('peopleRow');
  peopleRow.innerHTML = PEOPLE.map(p=>`<div class="chip ${state.me===p?'active':''}" data-person="${p}"><span class="dot">${initials(p)}</span>${p}</div>`).join('');
  peopleRow.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{ state.me = el.dataset.person; saveMe(); render(); });
  });

  document.getElementById('tabs').querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    });
  });

  renderItinerario(); renderMapa(); renderVotaciones(); renderChecklist(); renderPresupuesto();
}

function renderItinerario(){
  const el = document.getElementById('tab-itinerario');
  const days = DAY_STRINGS.map((d,i)=>{
    const {num,wd,mo} = fmtDay(d);
    let flag = '';
    if(i===0) flag = 'Llegada · vuelo STR → CAI (sale 19:45 del 9/10)';
    if(i===DAY_STRINGS.length-1) flag = 'Vuelo de vuelta · HRG → STR, sale 17:20';
    const note = (state.calendar[d] !== undefined) ? state.calendar[d] : (DEFAULT_CALENDAR[d] || '');
    return `<div class="day-card">
        <div class="d"><span class="num">${num}</span><span class="wd">${wd} ${mo}</span></div>
        <div class="body">
          ${flag ? `<div class="flag">${flag}</div>` : ''}
          <textarea data-date="${d}" placeholder="Plan del día...">${note}</textarea>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="flight-card"><div><div class="route">STR → CAI</div><div style="font-size:12.5px;opacity:.85">Vie 09.10.2026 · Economy Light · 1 escala</div></div><div class="meta">Sale 19:45</div></div>
    <div class="flight-card"><div><div class="route">HRG → STR</div><div style="font-size:12.5px;opacity:.85">Lun 19.10.2026 · Economy Light · 1 escala</div></div><div class="meta">Sale 17:20</div></div>
    <div class="river-wrap">${riverSvg()}</div>
    <div class="day-list">${days}</div>`;

  el.querySelectorAll('textarea').forEach(ta=>{
    ta.addEventListener('change', ()=>{ state.calendar[ta.dataset.date] = ta.value; saveShared(); });
  });
}

function renderMapa(){
  const el = document.getElementById('tab-mapa');
  el.innerHTML = '<iframe src="https://www.google.com/maps/d/embed?mid=1XryATKAlA2VuziEw-gYsULqJAhhhrRE&ehbc=2E312F" width="100%" height="480" style="border:1px solid var(--line);border-radius:10px;"></iframe>'
    + '<p class="badge-pp" style="margin-top:8px;">Mapa de MyMaps del grupo - templos, museos, comida y más, por categoría.</p>';
}

function renderVotaciones(){
  const el = document.getElementById('tab-votaciones');
  el.innerHTML = PLACES.map(seg=>{
    const cards = seg.items.map(it=>{
      const thumb = it.wiki ? wikiCache[it.wiki] : null;
      const customPhoto = state.photos[it.id];
      const photoUrl = customPhoto || thumb;
      const photoInner = photoUrl ? '' : iconSvg(it.icon || 'temple');
      const photoStyle = photoUrl ? 'style="background-image:url(\''+photoUrl.replace(/'/g,'')+'\')"' : '';
      const isOpen = it.status === 'abierto';
      let interestedHtml = '';
      if(isOpen){
        const interested = Object.keys(state.interest[it.id] || {}).filter(p=>state.interest[it.id][p]);
        const mine = state.me && state.interest[it.id] && state.interest[it.id][state.me];
        interestedHtml = '<div class="votes-row" style="margin-top:8px;">'
          + '<button class="sync-btn interest-btn" data-interest="'+it.id+'" style="'+(mine?'background:var(--nile);color:#fff;':'')+'">'+(mine?'✓ Me interesa':'Me interesa')+'</button>'
          + interested.map(p=>'<span class="vote-badge" title="'+p+'">'+initials(p)+'</span>').join('')
          + '</div>';
      } else {
        interestedHtml = '<div class="votes-row" style="margin-top:8px;"><span class="vote-count" style="color:var(--nile-dark);font-weight:600;">✓ en el plan</span></div>';
      }
      return '<div class="opt' + (isOpen?'':' picked') + '">'
        + '<div class="photo ' + (photoUrl?'':'empty') + '" ' + photoStyle + ' data-photofor="' + it.id + '">' + photoInner + '<span class="addphoto" data-photofor="' + it.id + '">' + (customPhoto?'cambiar foto':'+ foto') + '</span></div>'
        + '<div class="clickzone" style="cursor:default;">'
        + '<div class="name">' + it.name + '</div>'
        + '<div class="odesc">' + it.desc + '</div>'
        + interestedHtml
        + '</div></div>';
    }).join('');
    return '<div class="poll"><h3>' + seg.segment + '</h3><div class="opt-grid">' + cards + '</div></div>';
  }).join('');

  el.querySelectorAll('[data-interest]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!state.me){ alert('Primero elegí quién sos, arriba de todo.'); return; }
      const id = btn.dataset.interest;
      if(!state.interest[id]) state.interest[id] = {};
      state.interest[id][state.me] = !state.interest[id][state.me];
      saveShared(); renderVotaciones();
    });
  });
  el.querySelectorAll('[data-photofor]').forEach(el2=>{
    el2.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el2.dataset.photofor;
      const current = state.photos[id] || '';
      const url = prompt('Pegá el link de una foto (jpg/png) - dejalo vacío para volver a la foto automática:', current);
      if(url===null) return;
      if(url.trim()==='') delete state.photos[id]; else state.photos[id] = url.trim();
      saveShared(); renderVotaciones();
    });
  });
}

function dayOptionsHtml(selected){
  let out = '<option value=""'+(selected===""?" selected":"")+'>General</option>';
  DAY_STRINGS.forEach(d=>{
    const {num,mo} = fmtDay(d);
    out += '<option value="'+d+'"'+(selected===d?" selected":"")+'>'+num+' '+mo+'</option>';
  });
  return out;
}
function payerOptionsHtml(selected){
  let out = '<option value=""'+(selected===""?" selected":"")+'>—</option>';
  PEOPLE.forEach(p=>{ out += '<option value="'+p+'"'+(selected===p?" selected":"")+'>'+p+'</option>'; });
  return out;
}
function categoryOptionsHtml(selected){
  let out = '';
  CHECKLIST_CATEGORIES.forEach(c=>{ out += '<option value="'+c+'"'+(selected===c?" selected":"")+'>'+c+'</option>'; });
  return out;
}
function renderChecklist(){
  const el = document.getElementById('tab-checklist');
  const rows = state.checklist.map(item=>{
    return '<tr data-id="'+item.id+'">'
      + '<td><input type="checkbox" data-field="done" '+(item.done?'checked':'')+'></td>'
      + '<td><input type="text" data-field="name" value="'+(item.name||'').replace(/"/g,'&quot;')+'" placeholder="Qué hay que sacar" style="width:170px"></td>'
      + '<td><select data-field="category">'+categoryOptionsHtml(item.category)+'</select></td>'
      + '<td><select data-field="day">'+dayOptionsHtml(item.day||'')+'</select></td>'
      + '<td><input type="number" min="0" step="10" data-field="price" value="'+(item.price||0)+'" style="width:80px"> €</td>'
      + '<td><select data-field="payer">'+payerOptionsHtml(item.payer||'')+'</select></td>'
      + '<td><input type="text" data-field="link" value="'+(item.link||'').replace(/"/g,'&quot;')+'" placeholder="hotel / link" style="width:150px"></td>'
      + '<td><button class="sync-btn" data-del="'+item.id+'" title="Borrar">✕</button></td>'
      + '</tr>';
  }).join('');

  const doneCount = state.checklist.filter(i=>i.done).length;
  const totalPaid = state.checklist.filter(i=>i.done).reduce((s,i)=>s+Number(i.price||0),0);
  const totalPending = state.checklist.filter(i=>!i.done).reduce((s,i)=>s+Number(i.price||0),0);

  el.innerHTML = '<table class="budget"><thead><tr><th></th><th>Ítem</th><th>Categoría</th><th>Día</th><th>Precio</th><th>Pagó</th><th>Hotel / link</th><th></th></tr></thead>'
    + '<tbody id="checklistBody">' + rows + '</tbody></table>'
    + '<button class="sync-btn" id="addChecklistRow" style="margin-top:12px;">+ agregar ítem</button>'
    + '<div class="budget-summary">'
    + '<div class="metric"><div class="label">Reservado</div><div class="value">'+doneCount+' / '+state.checklist.length+'</div></div>'
    + '<div class="metric"><div class="label">Ya pagado</div><div class="value">€'+totalPaid.toLocaleString('es-AR')+'</div></div>'
    + '<div class="metric"><div class="label">Pendiente (estimado)</div><div class="value">€'+totalPending.toLocaleString('es-AR')+'</div></div>'
    + '</div>';

  function findItem(id){ return state.checklist.find(i=>i.id===id); }

  el.querySelectorAll('#checklistBody tr').forEach(tr=>{
    const id = tr.dataset.id;
    tr.querySelectorAll('[data-field]').forEach(fieldEl=>{
      const evt = (fieldEl.tagName==='SELECT' || fieldEl.type==='checkbox') ? 'change' : 'change';
      fieldEl.addEventListener(evt, ()=>{
        const item = findItem(id); if(!item) return;
        const f = fieldEl.dataset.field;
        if(f==='done') item.done = fieldEl.checked;
        else if(f==='price') item.price = Math.max(0, Number(fieldEl.value)||0);
        else item[f] = fieldEl.value;
        saveShared(); renderChecklist();
      });
    });
  });
  el.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.checklist = state.checklist.filter(i=>i.id!==btn.dataset.del);
      saveShared(); renderChecklist();
    });
  });
  document.getElementById('addChecklistRow').addEventListener('click', ()=>{
    state.checklist.push({id:'c'+Date.now(), name:'', category:CHECKLIST_CATEGORIES[0], day:'', done:false, price:0, payer:'', link:''});
    saveShared(); renderChecklist();
  });
}

function renderPresupuesto(){
  const el = document.getElementById('tab-presupuesto');
  const rows = BUDGET_CATEGORIES.map(c=>{
    const val = state.budget[c.id] ?? c.def;
    return `<tr><td>${c.name}<div class="badge-pp">${c.note}</div></td><td><span class="badge-pp">por persona</span></td><td><input type="number" min="0" step="10" data-cat="${c.id}" value="${val}"> €</td></tr>`;
  }).join('');
  const totalPP = BUDGET_CATEGORIES.reduce((s,c)=> s + Number(state.budget[c.id] ?? c.def), 0);
  const totalGroup = totalPP * PEOPLE.length;
  el.innerHTML = `
    <table class="budget"><thead><tr><th>Rubro</th><th></th><th>Estimado</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="sunk-note">Los vuelos STR↔CAI/HRG ya están reservados, no están incluidos en este cálculo.</div>
    <div class="budget-summary">
      <div class="metric"><div class="label">Por persona</div><div class="value">€${totalPP.toLocaleString('es-AR')}</div></div>
      <div class="metric"><div class="label">Grupo (6 personas)</div><div class="value">€${totalGroup.toLocaleString('es-AR')}</div></div>
    </div>`;
  el.querySelectorAll('input[type=number]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      state.budget[inp.dataset.cat] = Math.max(0, Number(inp.value)||0);
      saveShared(); renderPresupuesto();
    });
  });
}

init();
</script>
</body>
</html>
